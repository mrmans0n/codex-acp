name: Publish Alas downstream

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit at the head of the protected alas branch
        required: true
        type: string
      upstream_tag:
        description: Exact stable upstream tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-alas
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/alas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alas
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify source, upstream release, and sync review
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -o pipefail
          [[ "$UPSTREAM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin refs/heads/alas:refs/remotes/origin/alas
          git fetch --no-tags https://github.com/agentclientprotocol/codex-acp.git \
            '+refs/tags/*:refs/tags/*' \
            '+refs/heads/main:refs/alas-upstream-main'
          git checkout --detach "$SOURCE_COMMIT"
          gh api "repos/agentclientprotocol/codex-acp/releases/tags/$UPSTREAM_TAG" \
            > /tmp/alas-upstream-release.json
          node --input-type=module 2> >(tee /tmp/alas-publish-error.txt >&2) <<'NODE' > /tmp/alas-source.json
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {classifyDownstreamPatches} from './scripts/downstream-patches.mjs';
          import {verifyAlasSource} from './scripts/verify-alas-source.mjs';
          import {verifySyncReviewArtifact} from './scripts/sync-review.mjs';
          import {verifyUpstreamRelease} from './scripts/upstream-release.mjs';

          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const release = JSON.parse(readFileSync('/tmp/alas-upstream-release.json', 'utf8'));
          const npmResponse = await fetch('https://registry.npmjs.org/@agentclientprotocol%2Fcodex-acp/latest');
          if (!npmResponse.ok) throw new Error(`npm latest returned ${npmResponse.status}`);
          const npm = await npmResponse.json();
          const tagCommit = execFileSync('git', ['rev-parse', `${process.env.UPSTREAM_TAG}^{commit}`], {encoding: 'utf8'}).trim();
          verifyUpstreamRelease({tag: process.env.UPSTREAM_TAG, tagCommit, release, npm});
          const result = verifyAlasSource({
            cwd: process.cwd(),
            sourceCommit: process.env.SOURCE_COMMIT,
            alasRef: 'origin/alas',
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamMainRef: 'refs/alas-upstream-main',
            packageVersion,
          });
          const ledger = JSON.parse(readFileSync('docs/alas-downstream-patches.json', 'utf8'));
          const review = JSON.parse(readFileSync('docs/alas-sync-review.json', 'utf8'));
          const classifications = classifyDownstreamPatches({
            cwd: process.cwd(),
            ledger,
            baseRef: result.reviewBaseTag,
            targetRef: process.env.UPSTREAM_TAG,
          });
          verifySyncReviewArtifact({
            review,
            fromTag: result.reviewBaseTag,
            toTag: process.env.UPSTREAM_TAG,
            toCommit: result.upstreamCommit,
            classifications,
          });
          process.stdout.write(`${JSON.stringify(result)}\n`);
          NODE
          node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/alas-source.json', 'utf8'));
          appendFileSync(process.env.GITHUB_ENV,
            `ALAS_UPSTREAM_VERSION=${result.upstreamVersion}\n` +
            `ALAS_UPSTREAM_COMMIT=${result.upstreamCommit}\n` +
            `ALAS_SOURCE_COMMIT=${result.sourceCommit}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `commit=${result.sourceCommit}\n` +
            `upstream_version=${result.upstreamVersion}\n` +
            `upstream_commit=${result.upstreamCommit}\n`);
          NODE
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - id: install
        run: npm ci
      - id: typecheck
        run: npm run typecheck
      - id: test
        run: npm test
      - id: bundle
        run: npm run bundle:all
      - name: Read published manifests
        id: manifests
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@alas-ide%2Fcodex-acp');
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          writeFileSync('/tmp/alas-published.json', JSON.stringify(response.status === 404 ? [] : await response.json()));
          NODE
      - name: Prepare package
        id: prepare
        run: |
          ALAS_PUBLISHED_JSON="$(cat /tmp/alas-published.json)" \
            node scripts/prepare-alas-package.mjs > /tmp/alas-prepared.json
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const {version, alreadyPublished} = JSON.parse(readFileSync('/tmp/alas-prepared.json', 'utf8'));
          console.log(`version=${version}`);
          console.log(`alreadyPublished=${alreadyPublished}`);
          NODE
      - id: build
        run: npm run build
      - name: Check package contents
        id: pack
        run: |
          npm pack --dry-run --json > /tmp/alas-pack.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const [{files}] = JSON.parse(readFileSync('/tmp/alas-pack.json', 'utf8'));
          const paths = files.map((file) => file.path);
          if (!paths.includes('dist/index.js') || paths.some((path) => !manifest.files.includes(path))) {
            throw new Error(`Unexpected package contents: ${paths.join(', ')}`);
          }
          NODE
      - name: Publish
        id: publish-package
        if: ${{ steps.prepare.outputs.alreadyPublished != 'true' }}
        run: npm publish --access public --provenance --tag latest
      - name: Always write durable publication summary
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish-package.outcome }}
        run: |
          {
            echo "## Alas publication"
            echo
            echo "- Source commit: \`${{ inputs.source_commit }}\`"
            echo "- Upstream tag: \`${{ inputs.upstream_tag }}\`"
            echo "- Source/release/review verification: **${SOURCE_OUTCOME:-skipped}**"
            echo "- npm ci: **${INSTALL_OUTCOME:-skipped}**"
            echo "- Typecheck: **${TYPECHECK_OUTCOME:-skipped}**"
            echo "- Tests: **${TEST_OUTCOME:-skipped}**"
            echo "- Bundles: **${BUNDLE_OUTCOME:-skipped}**"
            echo "- Build: **${BUILD_OUTCOME:-skipped}**"
            echo "- Tarball check: **${PACK_OUTCOME:-skipped}**"
            echo "- Publish: **${PUBLISH_OUTCOME:-skipped}**"
            if [ -s /tmp/alas-publish-error.txt ]; then
              echo
              echo '```text'
              cat /tmp/alas-publish-error.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create immutable tag and release
        id: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.publish.outputs.upstream_commit }}
        run: |
          test -n "$VERSION"
          test -n "$SOURCE_COMMIT"
          test -n "$UPSTREAM_VERSION"
          test -n "$UPSTREAM_COMMIT"
          tag="alas-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_COMMIT" || {
              echo "::error::Existing $tag points to another commit; refusing to move it."
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$SOURCE_COMMIT"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_COMMIT" --title "$tag" \
              --notes "npm: @alas-ide/codex-acp@$VERSION. Upstream tag: v$UPSTREAM_VERSION. Upstream commit: $UPSTREAM_COMMIT. Source commit: $SOURCE_COMMIT."
          fi
      - name: Always write durable release-artifact summary
        if: ${{ always() }}
        env:
          RELEASE_OUTCOME: ${{ steps.release-artifacts.outcome }}
        run: |
          {
            echo "## Alas release artifacts"
            echo
            echo "- Source commit: \`${{ needs.publish.outputs.source_commit }}\`"
            echo "- Version: \`${{ needs.publish.outputs.version }}\`"
            echo "- Tag/release creation: **${RELEASE_OUTCOME:-skipped}**"
          } >> "$GITHUB_STEP_SUMMARY"
