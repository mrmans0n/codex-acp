name: Publish Alas downstream

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit at the head of the protected alas branch
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-alas
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/alas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: alas
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and upstream base
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin refs/heads/alas:refs/remotes/origin/alas
          test "$SOURCE_COMMIT" = "$(git rev-parse origin/alas)"
          git checkout --detach "$SOURCE_COMMIT"
          upstream_version="$(node -p "require('./package.json').version")"
          [[ "$upstream_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch https://github.com/agentclientprotocol/codex-acp.git \
            "refs/tags/v$upstream_version:refs/alas-upstream"
          upstream_commit="$(git rev-list -n 1 refs/alas-upstream)"
          git merge-base --is-ancestor "$upstream_commit" "$SOURCE_COMMIT"
          echo "ALAS_UPSTREAM_VERSION=$upstream_version" >> "$GITHUB_ENV"
          echo "ALAS_UPSTREAM_COMMIT=$upstream_commit" >> "$GITHUB_ENV"
          echo "ALAS_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:all
      - name: Read published manifests
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@alas-ide%2Fcodex-acp');
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          writeFileSync('/tmp/alas-published.json', JSON.stringify(response.status === 404 ? [] : await response.json()));
          NODE
      - name: Prepare package
        id: prepare
        run: |
          ALAS_PUBLISHED_JSON="$(cat /tmp/alas-published.json)" \
            node scripts/prepare-alas-package.mjs > /tmp/alas-prepared.json
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const { version, alreadyPublished } = JSON.parse(readFileSync('/tmp/alas-prepared.json', 'utf8'));
          console.log(`version=${version}`);
          console.log(`alreadyPublished=${alreadyPublished}`);
          NODE
      - run: npm run build
      - name: Check package contents
        run: |
          npm pack --dry-run --json > /tmp/alas-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const [{ files }] = JSON.parse(readFileSync('/tmp/alas-pack.json', 'utf8'));
          const paths = files.map(file => file.path);
          if (!paths.includes('dist/index.js') || paths.some(path => !manifest.files.includes(path))) {
            throw new Error(`Unexpected package contents: ${paths.join(', ')}`);
          }
          NODE
      - name: Publish
        if: ${{ steps.prepare.outputs.alreadyPublished != 'true' }}
        run: npm publish --access public --provenance --tag latest

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.publish.outputs.upstream_commit }}
        run: |
          test -n "$VERSION"
          test -n "$SOURCE_COMMIT"
          test -n "$UPSTREAM_VERSION"
          test -n "$UPSTREAM_COMMIT"
          tag="alas-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_COMMIT" || {
              echo "::error::Existing $tag points to another commit; refusing to move it."
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$SOURCE_COMMIT"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_COMMIT" --title "$tag" \
              --notes "npm: @alas-ide/codex-acp@$VERSION. Upstream tag: v$UPSTREAM_VERSION. Upstream commit: $UPSTREAM_COMMIT. Source commit: $SOURCE_COMMIT."
          fi
