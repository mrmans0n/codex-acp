name: Publish Alas downstream

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit at the head of the protected alas branch
        required: true
        type: string
      upstream_tag:
        description: Exact stable upstream tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-alas
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/alas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      integrity: ${{ steps.pack.outputs.integrity }}
      already_published: ${{ steps.prepare.outputs.alreadyPublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alas
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify source, upstream release, and sync review
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -o pipefail
          [[ "$UPSTREAM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin refs/heads/alas:refs/remotes/origin/alas
          git fetch --no-tags https://github.com/agentclientprotocol/codex-acp.git \
            '+refs/tags/*:refs/tags/*' \
            '+refs/heads/main:refs/alas-upstream-main'
          git checkout --detach "$SOURCE_COMMIT"
          gh api "repos/agentclientprotocol/codex-acp/releases/tags/$UPSTREAM_TAG" \
            > /tmp/alas-upstream-release.json
          node --input-type=module 2> >(tee /tmp/alas-publish-error.txt >&2) <<'NODE' > /tmp/alas-source.json
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {validatePatchLedger} from './scripts/downstream-patches.mjs';
          import {verifySyncSourceReview} from './scripts/verify-sync-source-review.mjs';
          import {verifyUpstreamRelease} from './scripts/upstream-release.mjs';

          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const release = JSON.parse(readFileSync('/tmp/alas-upstream-release.json', 'utf8'));
          const npmResponse = await fetch('https://registry.npmjs.org/@agentclientprotocol%2Fcodex-acp/latest');
          if (!npmResponse.ok) throw new Error(`npm latest returned ${npmResponse.status}`);
          const npm = await npmResponse.json();
          const tagCommit = execFileSync('git', ['rev-parse', `${process.env.UPSTREAM_TAG}^{commit}`], {encoding: 'utf8'}).trim();
          verifyUpstreamRelease({tag: process.env.UPSTREAM_TAG, tagCommit, release, npm});
          const ledger = JSON.parse(readFileSync('docs/alas-downstream-patches.json', 'utf8'));
          const review = JSON.parse(readFileSync('docs/alas-sync-review.json', 'utf8'));
          validatePatchLedger(ledger);
          const result = verifySyncSourceReview({
            cwd: process.cwd(),
            sourceCommit: process.env.SOURCE_COMMIT,
            alasRef: 'origin/alas',
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamMainRef: 'refs/alas-upstream-main',
            packageVersion,
            review,
            ledger,
          });
          process.stdout.write(`${JSON.stringify(result)}\n`);
          NODE
          node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/alas-source.json', 'utf8'));
          appendFileSync(process.env.GITHUB_ENV,
            `ALAS_UPSTREAM_VERSION=${result.upstreamVersion}\n` +
            `ALAS_UPSTREAM_COMMIT=${result.upstreamCommit}\n` +
            `ALAS_SOURCE_COMMIT=${result.sourceCommit}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `commit=${result.sourceCommit}\n` +
            `upstream_version=${result.upstreamVersion}\n` +
            `upstream_commit=${result.upstreamCommit}\n`);
          NODE
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - id: install
        run: npm ci
      - id: typecheck
        run: npm run typecheck
      - id: test
        run: npm test
      - name: Record missing-key E2E waiver
        id: e2e-waiver
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "::notice::E2E waived because OPENAI_API_KEY is not configured."
          echo "## Protected Alas E2E waived" >> "$GITHUB_STEP_SUMMARY"
          echo "OPENAI_API_KEY is absent, so npm run test:e2e was not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure E2E sandboxing
        if: ${{ env.OPENAI_API_KEY != '' }}
        timeout-minutes: 15
        run: |
          apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          for attempt in 1 2; do
            if timeout 300 sudo apt-get "${apt_opts[@]}" update \
              && timeout 120 sudo apt-get "${apt_opts[@]}" install --yes bubblewrap; then
              installed=yes
              break
            fi
            echo "apt attempt ${attempt} stalled or failed, retrying"
            sleep 10
          done
          if [ -z "${installed:-}" ]; then
            echo "::error::bubblewrap install failed after 2 attempts"
            exit 1
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run protected publication E2E gate
        id: e2e
        if: ${{ env.OPENAI_API_KEY != '' }}
        timeout-minutes: 15
        run: npm run test:e2e
      - id: bundle
        run: npm run bundle:all
      - name: Read published manifests
        id: manifests
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@alas-ide%2Fcodex-acp');
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          writeFileSync('/tmp/alas-published.json', JSON.stringify(response.status === 404 ? [] : await response.json()));
          NODE
      - name: Prepare package
        id: prepare
        run: |
          ALAS_PUBLISHED_JSON="$(cat /tmp/alas-published.json)" \
            node scripts/prepare-alas-package.mjs > /tmp/alas-prepared.json
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const {version, alreadyPublished} = JSON.parse(readFileSync('/tmp/alas-prepared.json', 'utf8'));
          console.log(`version=${version}`);
          console.log(`alreadyPublished=${alreadyPublished}`);
          NODE
      - id: build
        run: npm run build
      - name: Check package contents
        id: pack
        run: |
          npm pack --dry-run --json > /tmp/alas-pack.json
          node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const [{files, integrity}] = JSON.parse(readFileSync('/tmp/alas-pack.json', 'utf8'));
          const paths = files.map((file) => file.path);
          if (!paths.includes('dist/index.js') || paths.some((path) => !manifest.files.includes(path))) {
            throw new Error(`Unexpected package contents: ${paths.join(', ')}`);
          }
          if (typeof integrity !== 'string' || !integrity.startsWith('sha512-')) {
            throw new Error(`npm pack did not report sha512 integrity: ${integrity}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${integrity}\n`);
          NODE
      - name: Publish
        id: publish-package
        if: ${{ steps.prepare.outputs.alreadyPublished != 'true' }}
        run: npm publish --access public --provenance --tag latest
      - name: Always write durable publication summary
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_WAIVER_OUTCOME: ${{ steps.e2e-waiver.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish-package.outcome }}
        run: |
          {
            echo "## Alas publication"
            echo
            echo "- Source commit: \`${{ inputs.source_commit }}\`"
            echo "- Upstream tag: \`${{ inputs.upstream_tag }}\`"
            echo "- Source/release/review verification: **${SOURCE_OUTCOME:-skipped}**"
            echo "- npm ci: **${INSTALL_OUTCOME:-skipped}**"
            echo "- Typecheck: **${TYPECHECK_OUTCOME:-skipped}**"
            echo "- Tests: **${TEST_OUTCOME:-skipped}**"
            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "- Codex E2E gate: **${E2E_OUTCOME:-skipped}**"
            else
              echo "- Codex E2E gate: **waived** (OPENAI_API_KEY unavailable; waiver step ${E2E_WAIVER_OUTCOME:-skipped})"
            fi
            echo "- Bundles: **${BUNDLE_OUTCOME:-skipped}**"
            echo "- Build: **${BUILD_OUTCOME:-skipped}**"
            echo "- Tarball check: **${PACK_OUTCOME:-skipped}**"
            echo "- Publish: **${PUBLISH_OUTCOME:-skipped}**"
            echo "- alreadyPublished: **${{ steps.prepare.outputs.alreadyPublished || 'unknown' }}**"
            if [ -s /tmp/alas-publish-error.txt ]; then
              echo
              echo '```text'
              cat /tmp/alas-publish-error.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create immutable tag and release
        id: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.publish.outputs.upstream_commit }}
        run: |
          test -n "$VERSION"
          test -n "$SOURCE_COMMIT"
          test -n "$UPSTREAM_VERSION"
          test -n "$UPSTREAM_COMMIT"
          tag="alas-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_COMMIT" || {
              echo "::error::Existing $tag points to another commit; refusing to move it."
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$SOURCE_COMMIT"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_COMMIT" --title "$tag" \
              --notes "npm: @alas-ide/codex-acp@$VERSION. Upstream tag: v$UPSTREAM_VERSION. Upstream commit: $UPSTREAM_COMMIT. Source commit: $SOURCE_COMMIT."
          fi
      - name: Post-publication read-back
        id: verify-publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.publish.outputs.upstream_commit }}
          EXPECTED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
          ALREADY_PUBLISHED: ${{ needs.publish.outputs.already_published }}
        run: |
          set -Eeuo pipefail
          tag="alas-v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /tmp/alas-tag-ref.json
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,targetCommitish,isDraft,isPrerelease > /tmp/alas-release.json
          deadline=$((SECONDS + 750))
          while (( SECONDS < deadline )); do
            if node --input-type=module 2> /tmp/alas-readback-error.txt <<'NODE' > /tmp/alas-metadata.json
          import {readFileSync, writeFileSync} from 'node:fs';
          import {verifyAlasPublication} from './scripts/verify-alas-publication.mjs';

          const response = await fetch('https://registry.npmjs.org/@alas-ide%2Fcodex-acp', {
            headers: {'cache-control': 'no-cache'},
          });
          if (!response.ok) throw new Error(`npm packument returned ${response.status}`);
          const packument = await response.json();
          const attestationResponse = await fetch(
            `https://registry.npmjs.org/-/npm/v1/attestations/@alas-ide%2fcodex-acp@${process.env.VERSION}`,
            {headers: {'cache-control': 'no-cache'}},
          );
          if (!attestationResponse.ok) {
            throw new Error(`npm attestation endpoint returned ${attestationResponse.status}`);
          }
          const attestation = await attestationResponse.json();
          writeFileSync('/tmp/alas-attestation.json', JSON.stringify(attestation));
          const tagRef = JSON.parse(readFileSync('/tmp/alas-tag-ref.json', 'utf8'));
          if (tagRef?.object?.type !== 'commit') {
            throw new Error(`immutable tag does not directly identify a commit: ${tagRef?.object?.type}`);
          }
          const result = verifyAlasPublication({
            packageName: '@alas-ide/codex-acp',
            version: process.env.VERSION,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstreamVersion: process.env.UPSTREAM_VERSION,
            upstreamCommit: process.env.UPSTREAM_COMMIT,
            expectedIntegrity: process.env.EXPECTED_INTEGRITY,
            expectedRepository: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
            expectedWorkflowPath: '.github/workflows/publish-alas.yml',
            expectedWorkflowRef: 'refs/heads/alas',
            attestation,
            packument,
            tagCommit: tagRef.object.sha,
            release: JSON.parse(readFileSync('/tmp/alas-release.json', 'utf8')),
          });
          process.stdout.write(`${JSON.stringify({...result, alreadyPublished: process.env.ALREADY_PUBLISHED === 'true'})}\n`);
          NODE
            then
              cat /tmp/alas-metadata.json
              break
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              echo "Waiting for exact npm metadata and provenance (${remaining}s remaining)..."
              sleep 10
            fi
          done
          if [ ! -s /tmp/alas-metadata.json ]; then
            cat /tmp/alas-readback-error.txt >&2
            echo "::error::Post-publication read-back did not verify exact npm, tag, and release metadata."
            exit 1
          fi

          provenance_dir="$(mktemp -d)"
          trap 'rm -rf "$provenance_dir"' EXIT
          PROVENANCE_DIR="$provenance_dir" node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync(`${process.env.PROVENANCE_DIR}/package.json`, `${JSON.stringify({
            name: 'alas-publication-provenance-check',
            version: '1.0.0',
            private: true,
            dependencies: {'@alas-ide/codex-acp': process.env.VERSION},
          }, null, 2)}\n`);
          NODE
          npm install --prefix "$provenance_dir" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org --prefer-online --fetch-retries=0
          npm audit signatures --prefix "$provenance_dir" \
            --registry=https://registry.npmjs.org --json --include-attestations \
            > /tmp/alas-signature-audit.json
          PROVENANCE_DIR="$provenance_dir" node --input-type=module <<'NODE' > /tmp/alas-publication.json
          import {readFileSync} from 'node:fs';
          import {verifyInstalledPublication} from './scripts/verify-alas-publication.mjs';
          const lock = JSON.parse(readFileSync(`${process.env.PROVENANCE_DIR}/package-lock.json`, 'utf8'));
          const audit = JSON.parse(readFileSync('/tmp/alas-signature-audit.json', 'utf8'));
          const attestation = JSON.parse(readFileSync('/tmp/alas-attestation.json', 'utf8'));
          verifyInstalledPublication({
            packageName: '@alas-ide/codex-acp',
            version: process.env.VERSION,
            expectedIntegrity: process.env.EXPECTED_INTEGRITY,
            attestationUrl: `https://registry.npmjs.org/-/npm/v1/attestations/@alas-ide%2fcodex-acp@${process.env.VERSION}`,
            attestation,
            lock,
            audit,
          });
          const metadata = JSON.parse(readFileSync('/tmp/alas-metadata.json', 'utf8'));
          process.stdout.write(`${JSON.stringify({...metadata, cryptographicProvenance: true})}\n`);
          NODE
      - name: Always write durable release-artifact summary
        if: ${{ always() }}
        env:
          RELEASE_OUTCOME: ${{ steps.release-artifacts.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-publication.outcome }}
        run: |
          {
            echo "## Alas release artifacts"
            echo
            echo "- Source commit: \`${{ needs.publish.outputs.source_commit }}\`"
            echo "- Version: \`${{ needs.publish.outputs.version }}\`"
            echo "- Tag/release creation: **${RELEASE_OUTCOME:-skipped}**"
            echo "- Publication verification: **${VERIFY_OUTCOME:-skipped}**"
            echo "- alreadyPublished: **${{ needs.publish.outputs.already_published || 'unknown' }}**"
            if [ -s /tmp/alas-publication.json ]; then
              echo "- Verified read-back: \`$(cat /tmp/alas-publication.json)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
